<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="assets/img/logo.svg" type="image/svg+xml" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,800;1,400;1,800&family=Shantell+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css" />
    <title>Archive | [YOUR_NAME]</title>
    <meta name="description" content="[ARCHIVE_PAGE_DESCRIPTION]">
</head>

<body>
    <div id="scroll-progress"></div>
    <header class="header" id="header">
        <nav class="nav container">
            <a href="index.html" class="nav__logo" aria-label="Home">
                <img src="assets/img/logo.svg" class="nav__logo-svg" alt="">
            </a>
            <a href="index.html" class="nav__menu-btn"><span>back home</span><span class="nav__menu-btn-icon"><i class="bx bx-left-arrow-alt" style="color:#fff"></i></span></a>
        </nav>
    </header>
    <main class="main">
        <section class="page page--blue" id="archive" data-header-color="#FFFFFF">
            <div class="container">
                <a href="index.html#work" class="back-link"><i class="bx bx-left-arrow-alt"></i> back</a>
                <h1 class="section__title is-visible">the <em>archive</em></h1>
                <!-- Rows are rendered from SITE.archive in assets/js/config.js -->
                <table class="archive__table">
                    <thead>
                        <tr>
                            <th>Year</th>
                            <th>Project</th>
                            <th class="archive__hide-sm">Made at</th>
                            <th class="archive__hide-sm">Built with</th>
                            <th>Link</th>
                        </tr>
                    </thead>
                    <tbody id="archiveBody"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1/dist/lenis.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
